name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  check:
    name: Lint, types, manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: Type-check
        run: npm run check-types

      - name: Lint
        run: npm run lint

      # The settings dropdown is generated from the model registry. This fails
      # the build if someone edits one without regenerating the other.
      - name: Model registry is in sync with the manifest
        run: npm run sync-manifest -- --check

      # Dependencies are compiled into the bundle, so their licences travel with
      # it. This fails the build if one is added, removed or bumped without
      # regenerating the notices that ship alongside.
      - name: Third-party notices are up to date
        run: node scripts/third-party-notices.mjs --check

      # Neither scope npm offers is the right one. `--omit=dev` audits an empty
      # tree, because the libraries that ship are inlined into out/*.js and so
      # are devDependencies; the whole tree fails the build for advisories in
      # the test runner and the packaging tool, which are not in the VSIX and
      # are not ours to fix — @vscode/test-cli pins its own mocha, so bumping
      # mocha adds a second copy rather than replacing the vulnerable one.
      # This gates on the packages esbuild actually inlines.
      - name: Audit the dependencies that ship
        run: npm run audit-bundled

      # Reported, not gated: worth seeing, never worth blocking a release on.
      - name: Audit build and test tooling
        continue-on-error: true
        run: npm audit --audit-level=high

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      # Extension tests drive a real VS Code instance, which needs a display
      # server on Linux.
      - name: Test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm test
      - name: Test
        if: runner.os != 'Linux'
        run: npm test

  package:
    name: Package VSIX
    runs-on: ubuntu-latest
    needs: [check, test]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx @vscode/vsce package --no-dependencies --out llm-tokenizer.vsix

      # A sudden jump here almost always means the bundle broke and the raw
      # dependency tree is being packaged again.
      - name: Report VSIX contents and size
        run: |
          ls -lh llm-tokenizer.vsix
          unzip -l llm-tokenizer.vsix
          size=$(stat -c%s llm-tokenizer.vsix)
          echo "VSIX is $((size / 1024)) KB"
          if [ "$size" -gt 6000000 ]; then
            echo "::error::VSIX exceeded 6 MB — check that esbuild bundling still works"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: llm-tokenizer.vsix
