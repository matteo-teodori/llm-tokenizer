name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  check:
    name: Lint, types, manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: Type-check
        run: npm run check-types

      - name: Lint
        run: npm run lint

      # The settings dropdown is generated from the model registry. This fails
      # the build if someone edits one without regenerating the other.
      - name: Model registry is in sync with the manifest
        run: npm run sync-manifest -- --check

      - name: Audit production dependencies
        run: npm audit --audit-level=high --omit=dev

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      # Extension tests drive a real VS Code instance, which needs a display
      # server on Linux.
      - name: Test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm test
      - name: Test
        if: runner.os != 'Linux'
        run: npm test

  package:
    name: Package VSIX
    runs-on: ubuntu-latest
    needs: [check, test]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx @vscode/vsce package --no-dependencies --out llm-tokenizer.vsix

      # A sudden jump here almost always means the bundle broke and the raw
      # dependency tree is being packaged again.
      - name: Report VSIX contents and size
        run: |
          ls -lh llm-tokenizer.vsix
          unzip -l llm-tokenizer.vsix
          size=$(stat -c%s llm-tokenizer.vsix)
          echo "VSIX is $((size / 1024)) KB"
          if [ "$size" -gt 6000000 ]; then
            echo "::error::VSIX exceeded 6 MB — check that esbuild bundling still works"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: llm-tokenizer.vsix
