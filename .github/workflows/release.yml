name: Release

# Publishes on a version tag. Package once and publish that exact artifact to
# both registries — building twice risks shipping two different bundles under
# one version number.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and validate without publishing'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: marketplace
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Verify
        run: |
          npm run check-types
          npm run lint
          npm run sync-manifest -- --check
          node scripts/third-party-notices.mjs --check
      - name: Test
        run: xvfb-run -a npm test

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          manifest=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$manifest" != "$tag" ]; then
            echo "::error::tag $tag does not match package.json version $manifest"
            exit 1
          fi

      - name: Package
        id: package
        run: npx @vscode/vsce package --no-dependencies --out llm-tokenizer.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: llm-tokenizer.vsix

      # The three steps below are deliberately independent of each other's
      # outcome. A step whose `if` contains no status function is implicitly
      # gated on `success()`, so a transient failure publishing to one registry
      # skipped the other and the GitHub release — and re-running the job could
      # not recover, because the registry that had succeeded now rejected the
      # duplicate version and failed the job again before reaching the rest.
      # `!cancelled()` lifts that gate; `steps.package.outcome` keeps it honest,
      # so a failed verify, test or package still never reaches a publish. Both
      # publishes take --skip-duplicate, which makes a re-run idempotent.
      - name: Publish to the VS Code Marketplace
        if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run && steps.package.outcome == 'success' }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx @vscode/vsce publish --no-dependencies --skip-duplicate --packagePath llm-tokenizer.vsix

      - name: Publish to Open VSX
        if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run && steps.package.outcome == 'success' }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx ovsx publish --skip-duplicate llm-tokenizer.vsix

      - name: Create the GitHub release
        if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run && steps.package.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" llm-tokenizer.vsix --generate-notes --verify-tag || gh release upload "$GITHUB_REF_NAME" llm-tokenizer.vsix --clobber
