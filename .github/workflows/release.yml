name: Release

# Publishes on a version tag. All of CI runs on the tagged commit first, on
# the three systems and the engines floor, and the VSIX its package job built
# is the one published to both registries: building twice risks shipping two
# different bundles under one version number.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and validate without publishing'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # First, and cheap: a tag that does not match package.json fails here, not
  # after every test has run.
  tag:
    name: Tag matches package.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          manifest=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$manifest" != "$tag" ]; then
            echo "::error::tag $tag does not match package.json version $manifest"
            exit 1
          fi

  ci:
    name: CI
    needs: tag
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish
    needs: ci
    if: startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      # The GitHub release.
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      # The publishing tools, at the versions the lockfile pins. No package's
      # install script runs in the job that holds the tokens, and nothing is
      # built or tested here: that was CI's.
      - run: npm ci --ignore-scripts

      - name: Download the VSIX CI built
        id: download
        uses: actions/download-artifact@v4
        with:
          name: vsix

      # The three steps below are deliberately independent of each other's
      # outcome. A step whose `if` contains no status function is implicitly
      # gated on `success()`, so a transient failure publishing to one registry
      # skipped the other and the GitHub release — and re-running the job could
      # not recover, because the registry that had succeeded now rejected the
      # duplicate version and failed the job again before reaching the rest.
      # `!cancelled()` lifts that gate; `steps.download.outcome` keeps it
      # honest, so a failed download never reaches a publish. Both publishes
      # take --skip-duplicate, which makes a re-run idempotent.
      - name: Publish to the VS Code Marketplace
        if: ${{ !cancelled() && steps.download.outcome == 'success' }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: ./node_modules/.bin/vsce publish --no-dependencies --skip-duplicate --packagePath llm-tokenizer.vsix

      - name: Publish to Open VSX
        if: ${{ !cancelled() && steps.download.outcome == 'success' }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: ./node_modules/.bin/ovsx publish --skip-duplicate llm-tokenizer.vsix

      - name: Create the GitHub release
        if: ${{ !cancelled() && steps.download.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" llm-tokenizer.vsix --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag || gh release upload "$GITHUB_REF_NAME" llm-tokenizer.vsix --repo "$GITHUB_REPOSITORY" --clobber
